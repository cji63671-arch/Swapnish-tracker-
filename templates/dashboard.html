<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swapnish tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0b0f17;--panel:#131a26;--line:#223047;--txt:#e6edf7;--dim:#8b9bb4;--acc:#3b82f6;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px}
header .right{display:flex;gap:16px;align-items:center}
.tabs{display:flex;gap:6px}
.tab{padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--dim);cursor:pointer;font-size:13px}
.tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:22px}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin-bottom:14px}
input[type=text],select{background:#0d1420;border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:8px;font-size:14px;width:100%}
button.btn{background:var(--acc);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px}
button.btn.danger{background:var(--bad)}
.toggles{display:flex;gap:18px;margin:12px 0}
.toggles label{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
#map{height:420px;border-radius:12px;z-index:0}
.copy{font-family:monospace;font-size:12px;color:var(--acc);word-break:break-all;cursor:pointer}
.badge{padding:2px 8px;border-radius:99px;font-size:11px}
.badge.on{background:rgba(34,197,94,.15);color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.grid img{width:100%;height:140px;object-fit:cover;border-radius:10px 10px 0 0;display:block}
.grid figure{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grid figcaption{padding:8px 10px;font-size:11px;color:var(--dim)}
audio{width:100%;display:block}
.muted{color:var(--dim);font-size:13px;text-decoration:none}
#accChart,#batChart{width:100%}
#accChart{height:200px}
#batChart{height:120px}
</style>
</head>
<body>
<header>
  <h1>&#9671; Swapnish tracker</h1>
  <div class="right">
    <div class="tabs">
      <button class="tab active" data-panel="links">Links</button>
      <button class="tab" data-panel="map">Live Map</button>
      <button class="tab" data-panel="media">Media</button>
      <button class="tab" data-panel="stats">Stats</button>
    </div>
    <a href="/logout" class="muted">Logout</a>
  </div>
</header>
<main>
  <section class="panel active" id="panel-links">
    <div class="card">
      <h2>Create tracking link</h2>
      <input type="text" id="linkName" placeholder="Link name (e.g. Kids phone)">
      <div class="toggles">
        <label><input type="checkbox" id="tLoc" checked> Location</label>
        <label><input type="checkbox" id="tCam"> Camera</label>
        <label><input type="checkbox" id="tMic"> Microphone</label>
      </div>
      <button class="btn" onclick="createLink()">Generate link</button>
    </div>
    <div class="card">
      <h2>Your links</h2>
      <table>
        <thead><tr><th>Name</th><th>Link (click to copy)</th><th>Permissions</th><th>Created</th><th></th></tr></thead>
        <tbody id="linksBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="panel-map">
    <div class="card"><div id="map"></div></div>
    <div class="card">
      <h2>Recent reports</h2>
      <table>
        <thead><tr><th>Link</th><th>Lat</th><th>Lon</th><th>Accuracy</th><th>Battery</th><th>Time (UTC)</th></tr></thead>
        <tbody id="reportsBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="panel-media">
    <div class="card">
      <h2>Captured media</h2>
      <div class="grid" id="mediaGrid"></div>
    </div>
  </section>

  <section class="panel" id="panel-stats">
    <div class="card">
      <h2>GPS link stats</h2>
      <select id="statsLink" onchange="loadStats()"></select>
    </div>
    <div class="card">
      <h2>Accuracy history (meters)</h2>
      <canvas id="accChart"></canvas>
    </div>
    <div class="card">
      <h2>Battery history</h2>
      <canvas id="batChart"></canvas>
      <p id="batLatest" class="muted" style="margin-top:8px"></p>
    </div>
    <div class="card">
      <h2>Raw data points</h2>
      <table>
        <thead><tr><th>Time (UTC)</th><th>Accuracy</th><th>Battery</th><th>Charging</th></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let map = null, markers = {};

function fmtTime(iso){ return new Date(iso).toLocaleString(); }
function fmtNum(v){ return v == null ? '\u2014' : Number(v).toFixed(5); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function setupMap(){
  if (!map) {
    map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '\u00a9 OpenStreetMap' }).addTo(map);
  }
}

async function createLink(){
  const body = {
    name: $('linkName').value.trim() || 'Untitled',
    loc: $('tLoc').checked, cam: $('tCam').checked, mic: $('tMic').checked
  };
  try {
    const res = await fetch('/api/links', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('Server error ' + res.status + ': ' + (await res.text()).slice(0, 150));
    $('linkName').value = '';
    await loadLinks();
    loadStatsLinks();
  } catch (e) {
    alert('Link creation failed — ' + e.message);
  }
}

async function loadLinks(){
  const links = await (await fetch('/api/links')).json();
  const b = $('linksBody'); b.innerHTML = '';
  for (const l of links) {
    const perms = [l.loc && 'LOC', l.cam && 'CAM', l.mic && 'MIC'].filter(Boolean);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(l.name)}</td>
      <td><span class="copy" onclick="navigator.clipboard.writeText('${esc(l.url)}')">${esc(l.url)}</span></td>
      <td>${perms.map(p => `<span class="badge on">${p}</span>`).join(' ') || '<span class="badge">none</span>'}</td>
      <td>${fmtTime(l.created_at)}</td>
      <td><button class="btn danger" onclick="delLink(${l.id})">Revoke</button></td>`;
    b.appendChild(tr);
  }
}

async function delLink(id){ await fetch('/api/links/' + id, { method: 'DELETE' }); loadLinks(); loadStatsLinks(); }

async function loadReports(){
  const reps = await (await fetch('/api/reports')).json();
  const rows = $('reportsBody'); rows.innerHTML = '';
  const latest = {};
  for (const p of reps) if (!latest[p.link_id] && p.lat != null && p.lon != null) latest[p.link_id] = p;
  Object.values(latest).forEach(p => {
    if (!markers[p.link_id]) {
      markers[p.link_id] = L.marker([p.lat, p.lon]).addTo(map).bindPopup(`${esc(p.link_name)}<br>${fmtTime(p.created_at)}`);
    } else {
      markers[p.link_id].setLatLng([p.lat, p.lon]);
      markers[p.link_id].getPopup().setContent(`${esc(p.link_name)}<br>${fmtTime(p.created_at)}`);
    }
  });
  reps.slice(0, 50).forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(p.link_name)}</td><td>${fmtNum(p.lat)}</td><td>${fmtNum(p.lon)}</td>
      <td>${p.accuracy != null ? Math.round(p.accuracy) + ' m' : '\u2014'}</td>
      <td>${p.battery_level != null ? Math.round(p.battery_level * 100) + '%' + (p.battery_charging ? ' &#9889;' : '') : '\u2014'}</td>
      <td>${fmtTime(p.created_at)}</td>`;
    rows.appendChild(tr);
  });
}

async function loadMedia(){
  const med = await (await fetch('/api/media')).json();
  const g = $('mediaGrid'); g.innerHTML = '';
  for (const m of med) {
    const fig = document.createElement('figure');
    if (m.kind === 'photo') {
      fig.innerHTML = `<img src="${m.url}" loading="lazy"><button onclick="deleteMedia('${m.id}')">Delete</button><figcaption>${esc(m.link_name)} \u00b7 ${fmtTime(m.created_at)}</figcaption>`;
    } else {
      fig.innerHTML = `<audio controls src="${m.url}"></audio><figcaption>${esc(m.link_name)} \u00b7 ${fmtTime(m.created_at)}</figcaption>`;
    }
    g.appendChild(fig);
  }
}
async function deleteMedia(id) {
    if (confirm('Delete this photo?')) {
        await fetch('/api/media/' + id, { method: 'DELETE' });
        loadMedia();
    }
}
async function loadStatsLinks(){
  const links = await (await fetch('/api/links')).json();
  const sel = $('statsLink');
  sel.innerHTML = links.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('');
  if (links.length) loadStats();
}

async function loadStats(){
  const id = $('statsLink').value;
  if (!id) return;
  const pts = await (await fetch('/api/stats/' + id)).json();
  drawLine($('accChart'), pts.map(p => ({ t: new Date(p.created_at).getTime(), v: p.accuracy })), 'Accuracy (m)');
  drawLine($('batChart'), pts.map(p => ({ t: new Date(p.created_at).getTime(), v: p.battery_level != null ? p.battery_level * 100 : null })), 'Battery %', 100);
  const last = pts[pts.length - 1];
  $('batLatest').textContent = last && last.battery_level != null
    ? `Latest: ${Math.round(last.battery_level * 100)}% ${last.battery_charging ? '(charging)' : '(on battery)'} \u00b7 ${fmtTime(last.created_at)}`
    : 'No battery data yet (requires Chrome, Edge, Opera or Samsung Internet).';
  const body = $('statsBody'); body.innerHTML = '';
  pts.slice(-100).reverse().forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${fmtTime(p.created_at)}</td>
      <td>${p.accuracy != null ? Math.round(p.accuracy) + ' m' : '\u2014'}</td>
      <td>${p.battery_level != null ? Math.round(p.battery_level * 100) + '%' : '\u2014'}</td>
      <td>${p.battery_charging == null ? '\u2014' : (p.battery_charging ? 'yes' : 'no')}</td>`;
    body.appendChild(tr);
  });
}

function drawLine(canvas, pts, label, fixedMax){
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d1420'; ctx.fillRect(0, 0, W, H);
  const valid = pts.filter(p => p.v != null);
  if (!valid.length) {
    ctx.fillStyle = '#8b9bb4'; ctx.font = '12px sans-serif';
    ctx.fillText('No data yet \u2014 waiting for reports', 12, 22);
    return;
  }
  const pad = { l: 44, r: 12, t: 14, b: 26 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const minT = Math.min(...valid.map(p => p.t));
  const maxT = Math.max(...valid.map(p => p.t));
  const tSpan = (maxT - minT) || 1;
  const maxV = fixedMax || Math.max(...valid.map(p => p.v)) * 1.1 || 1;
  const X = t => pad.l + (t - minT) / tSpan * iw;
  const Y = v => pad.t + ih - (v / maxV) * ih;
  ctx.strokeStyle = '#223047'; ctx.fillStyle = '#8b9bb4'; ctx.font = '10px sans-serif'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const v = maxV * i / 4, y = Y(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillText(v.toFixed(0), 6, y + 3);
  }
  ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2;
  ctx.beginPath();
  valid.forEach((p, i) => { i ? ctx.lineTo(X(p.t), Y(p.v)) : ctx.moveTo(X(p.t), Y(p.v)); });
  ctx.stroke();
  ctx.fillStyle = '#22c55e';
  valid.forEach(p => { ctx.beginPath(); ctx.arc(X(p.t), Y(p.v), 2.5, 0, Math.PI * 2); ctx.fill(); });
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  t.classList.add('active');
  $('panel-' + t.dataset.panel).classList.add('active');
  if (t.dataset.panel === 'map') setupMap();
  if (t.dataset.panel === 'stats') loadStats();
}));

(async function init(){
  setupMap();
  await loadLinks();
  await loadReports();
  loadMedia();
  loadStatsLinks();
  setInterval(loadReports, 5000);
  setInterval(loadLinks, 10000);
  setInterval(loadMedia, 8000);
})();
</script>
</body>
</html>

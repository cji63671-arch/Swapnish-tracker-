<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swapnish tracker&middot; Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0b0f17;color:#e6edf7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#131a26;border:1px solid #223047;border-radius:16px;padding:30px;width:100%;max-width:360px}
h1{font-size:18px;margin-bottom:20px;text-align:center}
input{width:100%;background:#0d1420;border:1px solid #223047;color:#e6edf7;padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px}
button{width:100%;background:#3b82f6;color:#fff;border:0;padding:11px;border-radius:8px;font-size:15px;cursor:pointer}
.err{color:#ef4444;font-size:13px;margin-bottom:10px;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h1>&#9671; Swapnish tracker</h1>
  <form method="post">
    <input type="text" name="username" placeholder="Username" autocomplete="username" required>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <button type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
